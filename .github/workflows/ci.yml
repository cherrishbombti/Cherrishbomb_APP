# ─────────────────────────────────────────────────────────────────────────
# APP 저장소는 아직 CI 가 없다. (지금까지 7회 요청)
# BE·FE 와 잡 구성·이름·동작을 맞췄다. 그대로 커밋하면 바로 돈다.
#
# 검증 완료 (2026-08-21 기준):
#   - test/widget_test.dart 는 실제 로그인 화면 스모크 테스트다 (템플릿 아님)
#   - analysis_options.yaml 존재, flutter_lints 적용 중
# ─────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore: [ '**.md', '.gitignore' ]
  pull_request:
    branches: [ main, develop ]
    paths-ignore: [ '**.md', '.gitignore' ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # 포맷 검사 — 빠르게 끝나므로 별도 잡으로 분리한다.
  # 분석·테스트와 병렬로 돌아 전체 시간이 늘지 않고,
  # 실패했을 때 "포맷 문제"임이 잡 이름만 봐도 드러난다.
  # ─────────────────────────────────────────────────────────────
  format:
    name: 포맷 검사
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 팀 공통 컨벤션 120자에 맞춘다. (dart format 기본값은 80자)
      # analysis_options.yaml 의 formatter.page_width 와 반드시 같은 값이어야 한다.
      # 둘이 다르면 IDE 저장 결과와 CI 결과가 갈려서 무한히 싸운다.
      - name: 포맷 검사
        run: dart format --output=none --set-exit-if-changed --line-length 120 .

      - name: 실패 시 안내
        if: failure()
        run: |
          echo "::error::포맷 규칙에 어긋난 파일이 있습니다."
          echo ""
          echo "  로컬에서 아래를 실행하고 커밋하세요:"
          echo "      dart format --line-length 120 ."
          echo ""
          echo "  Android Studio / VS Code 에서 'Format on Save' 를 켜두면"
          echo "  analysis_options.yaml 의 page_width 를 따라 자동으로 맞춰집니다."

  # ─────────────────────────────────────────────────────────────
  # 분석 · 테스트
  # ─────────────────────────────────────────────────────────────
  analyze:
    name: 분석 · 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      # BE·FE 와 같은 규칙. 앱에도 API 키·keystore 가 들어올 수 있다.
      - name: 자격증명 커밋 여부 확인
        run: |
          leaked=$(git ls-files | grep -E \
            '(^|/)\.env$|(^|/)\.env\.(local|dev|prod)|google-services\.json$|GoogleService-Info\.plist$|\.(jks|keystore|p12|pem)$|key\.properties$' \
            || true)
          if [ -n "$leaked" ]; then
            echo "::error::자격증명으로 보이는 파일이 커밋돼 있습니다."
            echo "$leaked"
            exit 1
          fi
          echo "자격증명 파일 미커밋 확인 완료"

      # Flutter 는 공식 액션이 없어 사실상 표준인 서드파티 액션을 쓴다.
      # 재현성이 중요해지면 로컬 `flutter --version` 결과로 버전을 고정할 것.
      #   flutter-version: '3.x.y'
      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      # --fatal-infos 를 켜면 info 수준 린트도 실패로 취급한다.
      # 처음 켤 때 지적이 쏟아지면 일단 빼고, 정리된 뒤 다시 켜는 편이 낫다.
      - name: 정적 분석
        run: flutter analyze --fatal-infos

      - name: 테스트
        run: flutter test --reporter expanded

      - name: 테스트 실패 시 안내
        if: failure()
        run: |
          echo "::notice::스모크 테스트는 앱 첫 화면 구조에 의존합니다."
          echo "  라우팅(main.dart / app_router.dart)을 바꾸면 함께 갱신해주세요."

  # ─────────────────────────────────────────────────────────────
  # Android 빌드 — 실제로 컴파일되는지 확인한다.
  # analyze 만으로는 잡히지 않는 Gradle·플러그인 문제가 여기서 걸린다.
  # 느리다고 판단되면 이 잡만 지워도 된다.
  # ─────────────────────────────────────────────────────────────
  build:
    name: Android 빌드
    runs-on: ubuntu-latest
    needs: analyze

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: JDK 17 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      # FCM 을 붙이면 android/app/google-services.json 이 필요해진다.
      # 그 파일은 커밋하지 않으므로, 그때 아래 스텝을 살려 Secrets 에서 복원한다.
      # - name: google-services.json 복원
      #   run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: 디버그 APK 빌드
        run: flutter build apk --debug

      - name: APK 업로드
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 3
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  # 선택 잡 — 실패시키지 않고 경고만 남긴다. BE·FE 와 동일.
  # ─────────────────────────────────────────────────────────────
  pr-size:
    name: PR 크기 확인
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 변경 규모 측정
        run: |
          BASE="origin/${{ github.base_ref }}"
          FILES=$(git diff --name-only "$BASE"...HEAD -- . \
                  ':(exclude)**.md' ':(exclude)pubspec.lock' | wc -l)
          LINES=$(git diff --numstat "$BASE"...HEAD -- . \
                  ':(exclude)**.md' ':(exclude)pubspec.lock' \
                  | awk '{a+=$1; d+=$2} END {print a+d+0}')
          echo "변경 파일 ${FILES}개 / 변경 줄 ${LINES}줄"
          if [ "$FILES" -gt 10 ] || [ "$LINES" -gt 300 ]; then
            echo "::warning::PR 이 큽니다 (파일 ${FILES}개, ${LINES}줄). 기준은 파일 10개 / 300줄입니다. 나눌 수 있는지 검토해주세요."
          else
            echo "적정 크기입니다."
          fi
